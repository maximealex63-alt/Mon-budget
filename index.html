<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Perso & Pro - Budget Néon</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;700" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a60df2",
                        "neon-turquoise": "#00f2ea",
                        "neon-orange": "#ff8c00",
                        "background-dark": "#121212",
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                    borderRadius: { "DEFAULT": "1.5rem", "lg": "2rem", "xl": "3rem" }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #121212; color: white; min-height: 100vh; }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .neon-glow-violet { box-shadow: 0 0 15px rgba(166, 13, 242, 0.4); }
        .neon-glow-turquoise { box-shadow: 0 0 15px rgba(0, 242, 234, 0.4); }
        .input-dark { @apply bg-white/5 border-white/10 rounded-2xl p-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all w-full text-white; }
        select.input-dark { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip } = window.Recharts;

        const NATURES = [
            { id: 'Logement', icon: 'home' }, { id: 'Divertissement', icon: 'sports_esports' },
            { id: 'Courses', icon: 'shopping_cart' }, { id: 'Santé', icon: 'medical_services' },
            { id: 'Assurance', icon: 'shield' }, { id: 'Loyer & charges', icon: 'receipt_long' },
            { id: 'Restaurants & bar', icon: 'restaurant' }, { id: 'Shopping', icon: 'sell' },
            { id: 'Transport', icon: 'directions_car' }, { id: 'Autre', icon: 'more_horiz' }
        ];

        const COLORS = ['#a60df2', '#00f2ea', '#ff8c00', '#ec4899', '#10b981', '#f59e0b', '#3b82f6', '#64748b'];

        const App = () => {
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('budget_neon_data');
                return saved ? JSON.parse(saved) : [];
            });

            const [formData, setFormData] = useState({
                amount: '', description: '', category: 'propre', nature: 'Autre', date: new Date().toISOString().split('T')[0]
            });

            useEffect(() => {
                localStorage.setItem('budget_neon_data', JSON.stringify(expenses));
            }, [expenses]);

            const currentMonth = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(new Date());

            const stats = useMemo(() => {
                let propre = 0, commun = 0, pro = 0;
                expenses.forEach(e => {
                    const val = parseFloat(e.amount) || 0;
                    if (e.category === 'propre') propre += val;
                    else if (e.category === 'commun') commun += val;
                    else if (e.category === 'pro') pro += val;
                });
                return { perso: propre + (commun * 0.5), communHalf: commun * 0.5, pro };
            }, [expenses]);

            const chartData = useMemo(() => {
                const data = NATURES.map(n => ({
                    name: n.id,
                    value: expenses.filter(e => e.nature === n.id).reduce((acc, curr) => acc + parseFloat(curr.amount), 0)
                })).filter(d => d.value > 0);
                return data;
            }, [expenses]);

            const handleAdd = (e) => {
                e.preventDefault();
                if (!formData.amount || !formData.description) return;
                setExpenses([{ ...formData, id: Date.now() }, ...expenses]);
                setFormData({ ...formData, amount: '', description: '' });
            };

            const exportPDF = () => {
                if (!confirm("Générer le PDF et clôturer le mois ?")) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFontSize(18);
                doc.text(`Rapport Budget - ${currentMonth}`, 14, 20);
                doc.setFontSize(11);
                doc.text(`Total Personnel: ${stats.perso.toFixed(2)}€ (dont part commune: ${stats.communHalf.toFixed(2)}€)`, 14, 30);
                doc.text(`Total Professionnel: ${stats.pro.toFixed(2)}€`, 14, 37);

                const rows = expenses.map(e => [e.date, e.description, e.nature, e.category, `${e.amount}€`]);
                doc.autoTable({ head: [['Date', 'Description', 'Nature', 'Catégorie', 'Montant']], body: rows, startY: 45 });
                
                doc.save(`Budget_${currentMonth}.pdf`);
                setExpenses([]);
            };

            return (
                <div className="max-w-xl mx-auto pb-32">
                    {/* Header */}
                    <header className="px-6 py-8 flex items-center justify-between">
                        <div>
                            <h1 className="text-2xl font-black tracking-tight">Expert Perso & Pro</h1>
                            <p className="text-xs text-white/40 font-bold uppercase tracking-widest mt-1">{currentMonth}</p>
                        </div>
                        <button onClick={exportPDF} className="bg-white/5 p-3 rounded-full border border-white/10 text-neon-orange hover:neon-glow-orange transition-all">
                            <span className="material-symbols-outlined block">picture_as_pdf</span>
                        </button>
                    </header>

                    <main className="px-6 space-y-6">
                        {/* Summary Cards */}
                        <div className="grid grid-cols-2 gap-4">
                            <div className="glass-card p-5 rounded-3xl neon-glow-violet border-l-4 border-primary relative overflow-hidden">
                                <span className="material-symbols-outlined absolute -right-2 -top-2 text-primary/10 text-7xl">person</span>
                                <p className="text-white/60 text-[10px] font-bold uppercase">Total Personnel</p>
                                <h3 className="text-xl font-black mt-1">{stats.perso.toFixed(2)}€</h3>
                                <p className="text-[10px] text-primary mt-1 font-bold">Dont commun: {stats.communHalf.toFixed(2)}€</p>
                            </div>
                            <div className="glass-card p-5 rounded-3xl neon-glow-turquoise border-l-4 border-neon-turquoise relative overflow-hidden">
                                <span className="material-symbols-outlined absolute -right-2 -top-2 text-neon-turquoise/10 text-7xl">business_center</span>
                                <p className="text-white/60 text-[10px] font-bold uppercase">Professional</p>
                                <h3 className="text-xl font-black mt-1">{stats.pro.toFixed(2)}€</h3>
                            </div>
                        </div>

                        {/* Chart Section */}
                        {chartData.length > 0 && (
                            <section className="glass-card rounded-3xl p-6 flex flex-col items-center">
                                <h2 className="text-sm font-bold mb-4 uppercase tracking-widest text-white/40">Répartition Nature</h2>
                                <div className="w-full h-48">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie data={chartData} innerRadius={50} outerRadius={70} paddingAngle={5} dataKey="value">
                                                {chartData.map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                                            </Pie>
                                            <Tooltip contentStyle={{backgroundColor: '#1a1a1a', border: 'none', borderRadius: '10px'}} />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </section>
                        )}

                        {/* Input Form */}
                        <section className="glass-card p-6 rounded-[2.5rem] space-y-4 shadow-2xl">
                            <input type="number" step="0.01" placeholder="Montant €" className="input-dark" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} />
                            <input type="text" placeholder="Détails de la dépense..." className="input-dark" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} />
                            
                            <div className="grid grid-cols-3 gap-2">
                                {['propre', 'commun', 'pro'].map(c => (
                                    <button key={c} onClick={() => setFormData({...formData, category: c})} 
                                        className={`py-3 rounded-xl text-[10px] font-black uppercase transition-all border ${formData.category === c ? 'bg-primary border-primary neon-glow-violet' : 'bg-white/5 border-white/10 text-white/40'}`}>
                                        {c === 'propre' ? 'Moi' : c === 'commun' ? 'Commun' : 'Pro'}
                                    </button>
                                ))}
                            </div>

                            <select className="input-dark" value={formData.nature} onChange={e => setFormData({...formData, nature: e.target.value})}>
                                {NATURES.map(n => <option key={n.id} value={n.id} className="bg-background-dark">{n.id}</option>)}
                            </select>

                            <button onClick={handleAdd} className="w-full bg-primary py-4 rounded-2xl font-black tracking-widest hover:neon-glow-violet transition-all active:scale-95">
                                ENREGISTRER
                            </button>
                        </section>

                        {/* Transactions List */}
                        <section className="space-y-3">
                            <h2 className="text-lg font-bold px-2">Historique</h2>
                            {expenses.map(exp => (
                                <div key={exp.id} className="glass-card p-4 rounded-2xl flex items-center justify-between group">
                                    <div className="flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center bg-white/5 ${exp.category === 'pro' ? 'text-neon-turquoise' : 'text-primary'}`}>
                                            <span className="material-symbols-outlined text-xl">
                                                {NATURES.find(n => n.id === exp.nature)?.icon || 'payments'}
                                            </span>
                                        </div>
                                        <div>
                                            <p className="text-sm font-bold">{exp.description}</p>
                                            <p className="text-[10px] text-white/40 uppercase font-bold">{exp.nature} • {exp.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className="font-black text-sm">{parseFloat(exp.amount).toFixed(2)}€</p>
                                        <button onClick={() => setExpenses(expenses.filter(x => x.id !== exp.id))} className="text-white/20 hover:text-neon-orange transition-colors">
                                            <span className="material-symbols-outlined text-sm">delete</span>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </section>
                    </main>

                    {/* Background decor */}
                    <div className="fixed top-[-10%] left-[-20%] w-[60%] h-[40%] bg-primary/10 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
                    <div className="fixed bottom-[-10%] right-[-20%] w-[60%] h-[40%] bg-neon-turquoise/10 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
