<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget | Neon Pro & Sort</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
      
    <!-- Polices & Icônes -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    
    <!-- Scripts CDNs (Ordre critique) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#121212',
                        personal: '#a60df2',
                        professional: '#00f2ea',
                        common: '#0070f3',
                        accent: '#ff8c00',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #121212; color: white; margin: 0; min-height: 100vh; font-family: 'Manrope', sans-serif; overflow-x: hidden; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2.2rem; }
        
        /* Halos Néons Cartes */
        .neon-glow-orange { box-shadow: 0 0 20px rgba(255, 140, 0, 0.15); border: 1px solid rgba(255, 140, 0, 0.4); }
        .neon-glow-purple { box-shadow: 0 0 20px rgba(166, 13, 242, 0.15); border: 1px solid rgba(166, 13, 242, 0.4); }
        .neon-glow-turquoise { box-shadow: 0 0 20px rgba(0, 242, 234, 0.15); border: 1px solid rgba(0, 242, 234, 0.4); }
        
        /* Navigation Halos */
        .nav-btn-purple { box-shadow: 0 0 15px rgba(166, 13, 242, 0.3); border: 1px solid rgba(166, 13, 242, 0.3); }
        .nav-btn-turquoise { box-shadow: 0 0 15px rgba(0, 242, 234, 0.3); border: 1px solid rgba(0, 242, 234, 0.3); }
        .btn-plus-neon { background: #ff8c00; box-shadow: 0 0 20px #ff8c00, 0 0 40px rgba(255, 140, 0, 0.5); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .icon-stat { font-size: 32px !important; }

        @keyframes drift { 0% { transform: translate(0, 0); opacity: 0.2; } 50% { transform: translate(40px, 20px); opacity: 0.4; } 100% { transform: translate(-20px, 40px); opacity: 0.2; } }
        .glitter { position: fixed; border-radius: 50%; filter: blur(65px); z-index: -1; animation: drift 18s infinite alternate ease-in-out; pointer-events: none; }

        .modal-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        input, select { background: rgba(255, 255, 255, 0.06) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; border-radius: 1.25rem !important; padding: 1rem !important; outline: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .neon-checkbox { width: 18px; height: 18px; appearance: none; border: 2px solid rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .neon-checkbox:checked { background: #ff8c00; border-color: #ff8c00; box-shadow: 0 0 10px #ff8c00; }
        .neon-checkbox:checked::after { content: 'check'; font-family: 'Material Symbols Outlined'; font-size: 14px; color: black; font-weight: 900; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip } = window.Recharts;

        const RAW_NATURES = [
            { id: 'Abonnements', icon: 'sync_saved_locally', color: '#faff00' },
            { id: 'Assurance', icon: 'security', color: '#00ccff' },
            { id: 'Autre', icon: 'more_horiz', color: '#ffffff' },
            { id: 'Courses', icon: 'shopping_cart', color: '#00ff66' },
            { id: 'Divertissement', icon: 'movie', color: '#0ea5e9' },
            { id: 'Logement & charges', icon: 'home', color: '#ff8c00' },
            { id: 'Restaurants & bar', icon: 'local_dining', color: '#ff0055' },
            { id: 'Santé', icon: 'medical_services', color: '#ff00ff' },
            { id: 'Shopping', icon: 'shopping_bag', color: '#a855f7' },
            { id: 'Transport', icon: 'directions_car', color: '#00ffff' }
        ];

        const NATURES = [...RAW_NATURES].sort((a, b) => a.id.localeCompare(b.id));

        const initialFormState = { 
            amountStr: '', amount: 0, desc: '', cat: 'propre', nature: NATURES[0].id, 
            date: new Date().toISOString().split('T')[0], isRecurring: false,
            payer: 'Maxime', split: '50/50'
        };

        const App = () => {
            const [expenses, setExpenses] = useState(() => JSON.parse(localStorage.getItem('budget_neon_vFinal')) || []);
            const [archives, setArchives] = useState(() => JSON.parse(localStorage.getItem('archives_neon_vFinal')) || []);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isArchiveOpen, setIsArchiveOpen] = useState(false);
            const [isBalanceDetailOpen, setIsBalanceDetailOpen] = useState(false);
            const [viewingArchive, setViewingArchive] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [activeFilter, setActiveFilter] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
            const [formData, setFormData] = useState(initialFormState);

            useEffect(() => {
                localStorage.setItem('budget_neon_vFinal', JSON.stringify(expenses));
                localStorage.setItem('archives_neon_vFinal', JSON.stringify(archives));
            }, [expenses, archives]);

            const currentMonthName = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(new Date());

            const handleMathEval = (val) => {
                if (!val) return;
                try {
                    const clean = val.replace(/[^-+*/0-9.]/g, '');
                    const res = Function(`"use strict"; return (${clean})`)();
                    const final = parseFloat(parseFloat(res).toFixed(2));
                    setFormData(prev => ({ ...prev, amount: final, amountStr: final.toString() }));
                } catch (e) {}
            };

            const stats = useMemo(() => {
                let personal = 0, pro = 0, debt = 0, common = 0;
                expenses.forEach(e => {
                    const amt = parseFloat(e.amount) || 0;
                    if (e.cat === 'propre') personal += amt;
                    else if (e.cat === 'pro') pro += amt;
                    else if (e.cat === 'commun') {
                        common += amt;
                        if (e.split === '50/50') personal += (amt * 0.5);
                        else if (e.split === '100% Maxime') personal += amt;
                        if (e.payer === 'Maxime') {
                            if (e.split === '50/50') debt += (amt * 0.5);
                            else if (e.split === '100% Alix') debt += amt;
                        } else {
                            if (e.split === '50/50') debt -= (amt * 0.5);
                            else if (e.split === '100% Maxime') debt -= amt;
                        }
                    }
                });
                return { personal, pro, debt, common };
            }, [expenses]);

            const sortedExpenses = useMemo(() => {
                let data = activeFilter ? expenses.filter(e => e.nature === activeFilter) : [...expenses];
                data.sort((a, b) => {
                    let vA, vB;
                    if (sortConfig.key === 'amount') { vA = parseFloat(a.amount); vB = parseFloat(b.amount); }
                    else if (sortConfig.key === 'date') { vA = new Date(a.date); vB = new Date(b.date); }
                    else { vA = a.nature; vB = b.nature; }
                    return sortConfig.direction === 'asc' ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
                });
                return data;
            }, [expenses, activeFilter, sortConfig]);

            // GÉNÉRATION PDF GROUPÉ
            const downloadPDF = (archive) => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(18);
                    doc.text(`Rapport Budget : ${archive.month}`, 15, 20);

                    const categories = [
                        { label: "Dépenses Propres (100%)", key: "propre" },
                        { label: "Dépenses Communes", key: "commun" },
                        { label: "Frais Professionnels", key: "pro" }
                    ];

                    let currentY = 30;

                    categories.forEach(cat => {
                        const filteredData = archive.data.filter(e => e.cat === cat.key);
                        if (filteredData.length > 0) {
                            doc.setFontSize(12);
                            doc.setTextColor(cat.key === 'propre' ? '#a60df2' : (cat.key === 'commun' ? '#0070f3' : '#00f2ea'));
                            doc.text(cat.label, 15, currentY);
                            
                            const rows = filteredData.map(e => [e.displayDate, e.desc, e.nature, e.amount + '€']);
                            
                            doc.autoTable({
                                startY: currentY + 5,
                                head: [['Date', 'Description', 'Nature', 'Montant']],
                                body: rows,
                                theme: 'grid',
                                headStyles: { fillColor: [30, 30, 30] },
                                margin: { left: 15 }
                            });
                            
                            currentY = doc.lastAutoTable.finalY + 15;
                        }
                    });

                    doc.save(`Budget_${archive.month.replace(' ', '_')}.pdf`);
                } catch (e) { console.error(e); alert("Erreur PDF."); }
            };

            const handleSave = (e) => {
                e.preventDefault();
                const displayDate = new Date(formData.date).toLocaleDateString('fr-FR');
                if (editingId) setExpenses(expenses.map(ex => ex.id === editingId ? { ...formData, id: editingId, displayDate } : ex));
                else setExpenses([{ ...formData, id: Date.now(), displayDate }, ...expenses]);
                setIsModalOpen(false); setEditingId(null); setFormData(initialFormState);
            };

            const chartData = useMemo(() => {
                return NATURES.map(n => {
                    const val = expenses.filter(e => e.nature === n.id).reduce((acc, curr) => {
                        const amt = parseFloat(curr.amount) || 0;
                        if (curr.cat === 'propre') return acc + amt;
                        if (curr.cat === 'commun') {
                            if (curr.split === '50/50') return acc + (amt * 0.5);
                            if (curr.split === '100% Maxime') return acc + amt;
                        }
                        return acc;
                    }, 0);
                    return { name: n.id, value: val, color: n.color };
                }).filter(d => d.value > 0);
            }, [expenses]);

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-48">
                    {/* Paillettes */}
                    <div className="fixed inset-0 -z-10">
                        <div className="glitter bg-personal w-72 h-72 top-10 left-0"></div>
                        <div className="glitter bg-professional w-64 h-64 bottom-20 right-0"></div>
                    </div>

                    <header className="p-10 pb-4 text-center">
                        <h1 className="text-4xl font-extrabold tracking-tighter italic uppercase">BUDGET</h1>
                        <p className="text-white/30 text-[10px] font-bold tracking-[0.3em] mt-1 uppercase leading-none">{currentMonthName}</p>
                    </header>

                    {/* Dashboard */}
                    <div className="px-6 space-y-4 mb-8">
                        <button onClick={() => setIsBalanceDetailOpen(true)} className="glass p-6 w-full text-left active:scale-95 transition-all neon-glow-orange flex justify-between items-center h-28">
                            <div className="flex flex-col justify-center">
                                <p className="text-[10px] font-bold text-accent uppercase tracking-widest mb-1 leading-none">Balance Couple</p>
                                <h2 className="text-2xl font-black tracking-tight leading-none">
                                    {stats.debt === 0 ? "Équilibre" : stats.debt > 0 ? `Alix doit ${stats.debt.toFixed(2)}€` : `Maxime doit ${Math.abs(stats.debt).toFixed(2)}€`}
                                </h2>
                                <p className="text-[8px] text-white/30 mt-2 font-bold italic uppercase tracking-tighter">Voir le détail commun</p>
                            </div>
                            <span className="material-symbols-outlined neon-orange icon-stat">balance</span>
                        </button>

                        <div className="glass p-6 w-full neon-glow-purple flex justify-between items-center h-28">
                            <div className="flex flex-col justify-center">
                                <p className="text-[10px] font-bold text-personal uppercase tracking-widest mb-1 leading-none">Ma Charge Réelle</p>
                                <h2 className="text-3xl font-black tracking-tight leading-none">{stats.personal.toFixed(2)}€</h2>
                            </div>
                            <span className="material-symbols-outlined neon-purple icon-stat">wallet</span>
                        </div>
                        
                        <div className="glass p-6 w-full neon-glow-turquoise flex justify-between items-center h-28">
                            <div className="flex flex-col justify-center">
                                <p className="text-[10px] font-bold text-professional uppercase tracking-widest mb-1 leading-none tracking-widest">Cumul Frais Pro</p>
                                <h2 className="text-3xl font-extrabold text-white leading-none">{stats.pro.toFixed(2)}€</h2>
                            </div>
                            <span className="material-symbols-outlined neon-turquoise icon-stat">business_center</span>
                        </div>
                    </div>

                    {/* Graphique */}
                    <div className="px-6 mb-8">
                        <div className="glass p-6">
                            <div className="flex justify-between items-center mb-6 text-left px-2">
                                <p className="text-[10px] font-bold text-white/20 uppercase tracking-[0.2em]">Ma Part Réelle (%)</p>
                                {activeFilter && <button onClick={() => setActiveFilter(null)} className="text-[9px] font-black text-accent border border-accent/40 px-3 py-1 rounded-full uppercase">Voir tout</button>}
                            </div>
                            <div className="h-48 w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={chartData.length ? chartData : [{value: 1, color: '#222'}]} innerRadius={60} outerRadius={75} paddingAngle={8} dataKey="value" stroke="none" onClick={(d) => setActiveFilter(d.name)}>
                                            {chartData.map((e, i) => (
                                                <Cell key={i} fill={e.color} cornerRadius={10} style={{cursor:'pointer', filter: `drop-shadow(0 0 5px ${e.color})` }} />
                                            ))}
                                        </Pie>
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {/* Historique */}
                    <div className="px-6 space-y-3 pb-8">
                        {sortedExpenses.map(exp => {
                            const nat = NATURES.find(n => n.id === exp.nature) || NATURES[0];
                            return (
                                <div key={exp.id} className="glass p-4 flex items-center justify-between group border-white/5">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-2xl flex items-center justify-center bg-white/5" style={{ border: `1px solid ${nat.color}30` }}>
                                            <span className="material-symbols-outlined text-xl" style={{color: nat.color, filter: `drop-shadow(0 0 3px ${nat.color})`}}>{nat.icon}</span>
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2"><p className="text-sm font-bold text-white/90 leading-none">{exp.desc}</p>{exp.isRecurring && <span className="material-symbols-outlined text-[14px] text-accent">sync</span>}</div>
                                            <p className="text-[9px] text-white/30 uppercase font-bold mt-1 tracking-tight">{exp.cat === 'commun' ? `${exp.payer} (${exp.split})` : exp.cat}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <p className="font-extrabold text-sm text-white">{parseFloat(exp.amount).toFixed(2)}€</p>
                                        <div className="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => {setEditingId(exp.id); setFormData({...exp, amountStr: exp.amount.toString()}); setIsModalOpen(true);}} className="text-accent material-symbols-outlined text-lg">edit_note</button>
                                            <button onClick={() => setExpenses(expenses.filter(e=>e.id!==exp.id))} className="text-red-500 material-symbols-outlined text-lg">delete</button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Nav Bar */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-40">
                        <div className="glass h-20 px-8 flex justify-between items-center shadow-2xl relative">
                            <button onClick={() => setIsArchiveOpen(true)} className="flex flex-col items-center gap-1 active:scale-90 transition-transform nav-btn-purple p-2 rounded-2xl"><span className="material-symbols-outlined text-personal text-2xl">inventory_2</span><span className="text-[8px] font-black uppercase text-white/40 tracking-widest">Archives</span></button>
                            <button onClick={() => {setEditingId(null); setIsModalOpen(true);}} className="btn-plus-neon w-20 h-20 rounded-full flex items-center justify-center text-dark absolute -top-8 left-1/2 -translate-x-1/2 transition-transform active:scale-95"><span className="material-symbols-outlined font-black text-5xl">add</span></button>
                            <button onClick={() => { if(confirm(`Clôturer ${currentMonthName} ?`)) { const newArch = { id: Date.now(), month: currentMonthName, totals: {...stats}, data: [...expenses], isSettled: stats.debt===0 }; setArchives([newArch, ...archives].slice(0, 12)); setExpenses(expenses.filter(e=>e.isRecurring).map(e=>({...e, id: Date.now()+Math.random(), date: new Date().toISOString().split('T')[0], displayDate: new Date().toLocaleDateString('fr-FR')}))); }}} className="flex flex-col items-center gap-1 active:scale-90 transition-transform nav-btn-turquoise p-2 rounded-2xl"><span className="material-symbols-outlined text-professional text-2xl">archive</span><span className="text-[8px] font-black uppercase text-white/40 tracking-widest">Clôturer</span></button>
                        </div>
                    </div>

                    {/* Modal Archives (Bouton Visualisation Corrigé) */}
                    {isArchiveOpen && (
                        <div className="fixed inset-0 z-50 flex flex-col bg-dark/98 backdrop-blur-xl animate-slide-up p-8">
                            <header className="flex justify-between items-center mb-8 border-b border-white/10 pb-4"><h2 className="text-2xl font-black italic uppercase italic">Archives</h2><button onClick={() => setIsArchiveOpen(false)} className="glass w-12 h-12 flex items-center justify-center"><span className="material-symbols-outlined">close</span></button></header>
                            <div className="space-y-6 overflow-y-auto pb-32 hide-scrollbar">
                                {archives.map(arch => (
                                    <div key={arch.id} className="glass p-5 space-y-4 border-white/5">
                                        <div className="flex justify-between items-center">
                                            <p className="font-black text-white/80 uppercase tracking-widest text-sm">{arch.month}</p>
                                            <div className="flex gap-2">
                                                <button onClick={() => setViewingArchive(arch)} className="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-professional"><span className="material-symbols-outlined text-sm">visibility</span></button>
                                                <button onClick={() => downloadPDF(arch)} className="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-accent"><span className="material-symbols-outlined text-sm">download</span></button>
                                                <button onClick={() => setArchives(archives.filter(a=>a.id!==arch.id))} className="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-white/20 hover:text-red-500"><span className="material-symbols-outlined text-sm">delete</span></button>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-center text-[7px] font-black uppercase">
                                            <div className="bg-white/5 p-2 rounded-xl"><p className="text-personal mb-1 tracking-widest leading-none">Perso</p><p className="text-sm font-black">{arch.totals.personal.toFixed(0)}€</p></div>
                                            <div className="bg-white/5 p-2 rounded-xl"><p className="text-common mb-1 tracking-widest leading-none">Commun</p><p className="text-sm font-black">{arch.totals.common.toFixed(0)}€</p></div>
                                            <div className="bg-white/5 p-2 rounded-xl"><p className="text-white/40 mb-1 tracking-widest leading-none">Pro</p><p className="text-sm font-black text-white">{arch.totals.pro.toFixed(0)}€</p></div>
                                        </div>
                                        <label className="flex items-center gap-2 cursor-pointer w-fit">
                                            <input type="checkbox" className="neon-checkbox" checked={arch.isSettled} onChange={() => setArchives(archives.map(a=>a.id===arch.id?{...a,isSettled:!a.isSettled}:a))} />
                                            <span className={`text-[10px] font-bold ${arch.isSettled ? 'text-white/30 italic' : 'text-accent'}`}>{arch.isSettled ? "Balance équilibrée" : (arch.totals.debt > 0 ? `Alix doit ${arch.totals.debt.toFixed(2)}€` : `Maxime doit ${Math.abs(arch.totals.debt).toFixed(2)}€`)}</span>
                                        </label>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Viewer Detail Archive (Corrigé) */}
                    {viewingArchive && (
                        <div className="fixed inset-0 z-[60] flex flex-col bg-dark animate-slide-up p-8">
                            <header className="flex justify-between items-center mb-8 border-b border-white/10 pb-4"><div><p className="text-[10px] font-bold text-accent uppercase tracking-widest">Détail archive</p><h2 className="text-xl font-black italic uppercase italic leading-none">{viewingArchive.month}</h2></div><button onClick={() => setViewingArchive(null)} className="glass w-12 h-12 flex items-center justify-center"><span className="material-symbols-outlined">arrow_back</span></button></header>
                            <div className="space-y-3 overflow-y-auto pb-32 hide-scrollbar">
                                {viewingArchive.data.map(exp => (
                                    <div key={exp.id} className="glass p-4 flex justify-between items-center border-white/5">
                                        <div className="flex items-center gap-4">
                                            <div className="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><span className="material-symbols-outlined text-sm text-white/40">{RAW_NATURES.find(n=>n.id===exp.nature)?.icon}</span></div>
                                            <div><p className="text-sm font-bold text-white/90 leading-none">{exp.desc}</p><p className="text-[9px] text-white/30 uppercase mt-1 leading-none">{exp.nature} • {exp.cat}</p></div>
                                        </div>
                                        <p className="font-extrabold text-sm text-white">{parseFloat(exp.amount).toFixed(2)}€</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Balance Detail */}
                    {isBalanceDetailOpen && (
                        <div className="fixed inset-0 z-50 flex flex-col bg-dark/98 backdrop-blur-xl animate-slide-up p-8">
                            <header className="flex justify-between items-center mb-8 border-b border-white/10 pb-4"><h2 className="text-2xl font-black italic uppercase italic leading-none">Détail Balance</h2><button onClick={() => setIsBalanceDetailOpen(false)} className="glass w-12 h-12 flex items-center justify-center transition-transform active:scale-90"><span className="material-symbols-outlined">close</span></button></header>
                            <div className="space-y-4 overflow-y-auto pb-32 hide-scrollbar">
                                {expenses.filter(e=>e.cat==='commun').map(e=>(
                                    <div key={e.id} className="glass p-4 flex justify-between items-center border-white/5">
                                        <div><p className="font-bold text-white/90 leading-tight">{e.desc}</p><p className="text-[10px] text-white/40 mt-0.5">Par {e.payer} ({e.split})</p></div>
                                        <p className="font-black text-white">{parseFloat(e.amount).toFixed(2)}€</p>
                                    </div>
                                ))}
                                <div className="mt-8 p-6 glass border-accent/20 bg-accent/5 text-center shadow-lg">
                                    <p className="text-3xl font-black mb-4 leading-tight">{stats.debt === 0 ? "Équilibre" : stats.debt > 0 ? `Alix doit ${stats.debt.toFixed(2)}€` : `Maxime doit ${Math.abs(stats.debt).toFixed(2)}€`}</p>
                                    <button onClick={() => {if(confirm("Équilibrer ?")) setExpenses(expenses.map(e=>e.cat==='commun'?{...e,cat:'propre'}:e)); setIsBalanceDetailOpen(false);}} className="w-full py-4 bg-accent rounded-2xl text-dark font-black text-xs uppercase tracking-widest">Virement effectué</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Saisie */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/85 backdrop-blur-sm p-4">
                            <div className="glass w-full max-w-sm p-8 modal-up border-accent/20 shadow-2xl">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-extrabold italic uppercase italic">{editingId ? 'Modifier' : 'Ajouter'}</h2><button onClick={() => setIsModalOpen(false)} className="text-white/30"><span className="material-symbols-outlined">close</span></button></div>
                                <form onSubmit={handleSave} className="space-y-4">
                                    <input type="date" className="w-full font-bold" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} required />
                                    <input type="text" placeholder="Montant (ex: 12.50+5)" className="w-full text-2xl font-black focus:border-accent" value={formData.amountStr} onChange={e => setFormData({...formData, amountStr: e.target.value})} onBlur={e => handleMathEval(e.target.value)} required />
                                    <input type="text" placeholder="Description" className="w-full text-sm font-bold" value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} required />
                                    <label className="flex items-center gap-3 cursor-pointer user-select-none w-fit"><input type="checkbox" className="neon-checkbox" checked={formData.isRecurring} onChange={e => setFormData({...formData, isRecurring: e.target.checked})} /><span className="text-[10px] font-bold text-white/40 uppercase tracking-widest">Récurrente</span></label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['propre', 'commun', 'pro'].map(c => (
                                            <button key={c} type="button" onClick={() => setFormData({...formData, cat: c})} className={`py-3 rounded-2xl text-[9px] font-black uppercase transition-all border ${formData.cat === c ? 'bg-white text-dark border-white scale-95 shadow-xl' : 'bg-transparent text-white/40 border-white/10'}`}>{c}</button>
                                        ))}
                                    </div>
                                    {formData.cat === 'commun' && (
                                        <div className="p-4 glass space-y-4 border-white/10">
                                            <div className="flex gap-2">{['Maxime', 'Alix'].map(p => <button key={p} type="button" onClick={() => setFormData({...formData, payer: p})} className={`flex-1 py-2 rounded-xl text-[10px] font-bold border ${formData.payer === p ? 'bg-professional text-dark border-professional shadow-lg' : 'border-white/10 text-white/40'}`}>{p} paye</button>)}</div>
                                            <div className="flex gap-2">{['50/50', '100% Maxime', '100% Alix'].map(s => <button key={s} type="button" onClick={() => setFormData({...formData, split: s})} className={`flex-1 py-1.5 rounded-lg text-[8px] font-black border transition-all ${formData.split === s ? 'border-accent text-accent bg-accent/5' : 'border-white/5 text-white/20'}`}>{s}</button>)}</div>
                                        </div>
                                    )}
                                    <select className="w-full text-sm font-bold appearance-none" value={formData.nature} onChange={e => setFormData({...formData, nature: e.target.value})}>
                                        {NATURES.map(n => <option key={n.id} value={n.id} className="bg-dark text-white">{n.id}</option>)}
                                    </select>
                                    <button className="btn-plus-neon w-full py-5 rounded-3xl text-dark font-black tracking-widest text-xs mt-4 uppercase">Valider</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
