<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget | Neon Pro & Sort</title>
    
    <!-- Polices & Icônes -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    
    <!-- Scripts CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#121212',
                        personal: '#a60df2',
                        professional: '#00f2ea',
                        accent: '#ff8c00',
                    },
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                }
            }
        }
    </script>

    <style>
        body { background-color: #121212; color: white; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
        }

        .neon-purple { filter: drop-shadow(0 0 5px #a60df2); color: #a60df2; }
        .neon-turquoise { filter: drop-shadow(0 0 5px #00f2ea); color: #00f2ea; }
        .neon-orange { filter: drop-shadow(0 0 8px #ff8c00); color: #ff8c00; }
        
        .card-personal { border-bottom: 2px solid #a60df2; }
        .card-pro { border-bottom: 2px solid rgba(0, 242, 234, 0.3); }

        .btn-plus {
            background: #ff8c00;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        input, select {
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 1.25rem !important;
            padding: 1rem !important;
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip } = window.Recharts;

        const NATURES = [
            { id: 'Logement', icon: 'home', color: '#ff8c00' },
            { id: 'Loyer & charges', icon: 'receipt_long', color: '#ff4b2b' },
            { id: 'Courses', icon: 'shopping_cart', color: '#00f2ea' },
            { id: 'Restaurants & bar', icon: 'local_dining', color: '#a60df2' },
            { id: 'Divertissement', icon: 'movie', color: '#4facfe' },
            { id: 'Santé', icon: 'medical_services', color: '#10b981' },
            { id: 'Assurance', icon: 'security', color: '#64748b' },
            { id: 'Shopping', icon: 'shopping_bag', color: '#ec4899' },
            { id: 'Transport', icon: 'directions_car', color: '#06b6d4' },
            { id: 'Autre', icon: 'more_horiz', color: '#94a3b8' }
        ];

        const App = () => {
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('budget_app_v9_sort');
                return saved ? JSON.parse(saved) : [];
            });
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

            const initialFormState = { 
                amount: '', desc: '', cat: 'propre', nature: 'Autre',
                date: new Date().toISOString().split('T')[0] 
            };

            const [formData, setFormData] = useState(initialFormState);
            const currentMonth = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(new Date());

            useEffect(() => {
                localStorage.setItem('budget_app_v9_sort', JSON.stringify(expenses));
            }, [expenses]);

            // LOGIQUE DE TRI
            const sortedExpenses = useMemo(() => {
                let sortable = [...expenses];
                sortable.sort((a, b) => {
                    let valA, valB;
                    if (sortConfig.key === 'date') {
                        valA = new Date(a.date); valB = new Date(b.date);
                    } else if (sortConfig.key === 'amount') {
                        valA = parseFloat(a.amount); valB = parseFloat(b.amount);
                    } else {
                        valA = a.nature; valB = b.nature;
                    }

                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return sortable;
            }, [expenses, sortConfig]);

            const handleSort = (key) => {
                let direction = 'desc';
                if (sortConfig.key === key && sortConfig.direction === 'desc') {
                    direction = 'asc';
                }
                setSortConfig({ key, direction });
            };

            // CALCULS DASHBOARD
            const totals = useMemo(() => {
                let propre = 0, commun = 0, pro = 0;
                expenses.forEach(e => {
                    const val = parseFloat(e.amount) || 0;
                    if (e.cat === 'propre') propre += val;
                    else if (e.cat === 'commun') commun += val;
                    else if (e.cat === 'pro') pro += val;
                });
                return { personal: propre + (commun * 0.5), professional: pro };
            }, [expenses]);

            const chartData = useMemo(() => {
                const data = NATURES.map(n => {
                    const partValue = expenses
                        .filter(e => e.nature === n.id)
                        .reduce((acc, curr) => {
                            const val = parseFloat(curr.amount) || 0;
                            if (curr.cat === 'propre') return acc + val;
                            if (curr.cat === 'commun') return acc + (val * 0.5);
                            return acc;
                        }, 0);
                    return { name: n.id, value: partValue, color: n.color };
                }).filter(d => d.value > 0);

                const totalPersonal = data.reduce((sum, item) => sum + item.value, 0);
                return data.map(item => ({
                    ...item,
                    percentage: totalPersonal > 0 ? ((item.value / totalPersonal) * 100).toFixed(1) : 0
                }));
            }, [expenses]);

            // ACTIONS MODAL
            const openEdit = (exp) => {
                setEditingId(exp.id);
                setFormData({ ...exp });
                setIsModalOpen(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                const displayDate = new Date(formData.date).toLocaleDateString('fr-FR');
                if (editingId) {
                    setExpenses(expenses.map(exp => exp.id === editingId ? { ...formData, displayDate } : exp));
                } else {
                    setExpenses([{ ...formData, id: Date.now(), displayDate }, ...expenses]);
                }
                setIsModalOpen(false);
                setEditingId(null);
            };

            const closeMonth = () => {
                if (!confirm("Exporter le PDF et réinitialiser ?")) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text(`BUDGET - ${currentMonth}`, 15, 20);
                doc.autoTable({
                    head: [['Date', 'Description', 'Nature', 'Type', 'Montant']],
                    body: sortedExpenses.map(e => [e.displayDate, e.desc, e.nature, e.cat, `${e.amount}€`]),
                });
                doc.save(`Budget_${currentMonth}.pdf`);
                setExpenses([]);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-40">
                    <header className="p-8 pb-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-extrabold tracking-tighter italic uppercase tracking-widest">BUDGET</h1>
                            <p className="text-white/30 text-[10px] uppercase font-bold tracking-[0.3em]">{currentMonth}</p>
                        </div>
                        <button onClick={closeMonth} className="glass w-12 h-12 flex items-center justify-center">
                            <span className="material-symbols-outlined neon-orange">ios_share</span>
                        </button>
                    </header>

                    {/* Dashboard */}
                    <div className="px-6 grid grid-cols-2 gap-4 mb-6">
                        <div className="glass p-5 card-personal">
                            <span className="material-symbols-outlined neon-purple text-2xl mb-1">account_balance_wallet</span>
                            <p className="text-[10px] font-bold text-personal uppercase tracking-widest">Ma Charge</p>
                            <h2 className="text-2xl font-extrabold tracking-tight">{totals.personal.toFixed(2)}€</h2>
                        </div>
                        <div className="glass p-5 card-pro text-white/50">
                            <span className="material-symbols-outlined text-2xl mb-1 opacity-50 neon-turquoise">business_center</span>
                            <p className="text-[10px] font-bold uppercase tracking-widest">Frais Pro</p>
                            <h2 className="text-2xl font-extrabold tracking-tight text-white/80">{totals.professional.toFixed(2)}€</h2>
                        </div>
                    </div>

                    {/* Chart Area */}
                    <div className="px-6 mb-6">
                        <div className="glass p-6">
                            <p className="text-[10px] text-center font-bold text-white/20 uppercase tracking-[0.2em] mb-4">Répartition Réelle (%)</p>
                            <div className="h-48 w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={chartData.length ? chartData : [{value: 1, color: '#222'}]} innerRadius={60} outerRadius={75} paddingAngle={8} dataKey="value" stroke="none">
                                            {chartData.map((entry, index) => <Cell key={index} fill={entry.color} cornerRadius={10} />)}
                                        </Pie>
                                        <Tooltip contentStyle={{display:'none'}} />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="mt-4 grid grid-cols-2 gap-y-3 gap-x-4 overflow-hidden">
                                {chartData.map((entry, index) => (
                                    <div key={index} className="flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: entry.color, boxShadow: `0 0 5px ${entry.color}`}}></div>
                                        <div className="flex flex-col">
                                            <span className="text-[9px] text-white/40 uppercase font-bold leading-none">{entry.name}</span>
                                            <span className="text-[11px] font-black text-white">{entry.percentage}%</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Historical List + SORT BAR */}
                    <div className="px-6 space-y-3 pb-8">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <h3 className="text-[10px] font-bold text-white/20 uppercase tracking-widest">Historique</h3>
                            
                            {/* Sort Bar */}
                            <div className="flex items-center gap-3 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
                                <button onClick={() => handleSort('date')} className={`transition-all ${sortConfig.key === 'date' ? 'neon-orange' : 'text-white/20'}`}>
                                    <span className="material-symbols-outlined text-[18px]">calendar_month</span>
                                </button>
                                <button onClick={() => handleSort('nature')} className={`transition-all ${sortConfig.key === 'nature' ? 'neon-orange' : 'text-white/20'}`}>
                                    <span className="material-symbols-outlined text-[18px]">label</span>
                                </button>
                                <button onClick={() => handleSort('amount')} className={`transition-all ${sortConfig.key === 'amount' ? 'neon-orange' : 'text-white/20'}`}>
                                    <span className="material-symbols-outlined text-[18px]">euro</span>
                                </button>
                                <span className="material-symbols-outlined text-[14px] text-white/40 ml-1">
                                    {sortConfig.direction === 'asc' ? 'arrow_upward' : 'arrow_downward'}
                                </span>
                            </div>
                        </div>

                        {sortedExpenses.length === 0 && <p className="text-center text-white/10 text-xs py-10 italic">Aucune donnée</p>}
                        
                        {sortedExpenses.map(exp => {
                            const natureConfig = NATURES.find(n => n.id === exp.nature) || NATURES[NATURES.length-1];
                            return (
                                <div key={exp.id} className="glass p-4 flex items-center justify-between border-white/5 group">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-2xl flex items-center justify-center" style={{ backgroundColor: `${natureConfig.color}15`, border: `1px solid ${natureConfig.color}30` }}>
                                            <span className="material-symbols-outlined text-xl" style={{ color: natureConfig.color, filter: `drop-shadow(0 0 3px ${natureConfig.color})` }}>
                                                {natureConfig.icon}
                                            </span>
                                        </div>
                                        <div>
                                            <p className="text-sm font-bold tracking-tight">{exp.desc}</p>
                                            <p className="text-[9px] text-white/30 uppercase font-bold">
                                                <span style={{color: natureConfig.color}}>{exp.nature}</span> • {exp.cat}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="text-right mr-1">
                                            <p className="font-extrabold text-sm">{exp.amount}€</p>
                                            <p className="text-[8px] text-white/20">{exp.displayDate}</p>
                                        </div>
                                        <div className="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => openEdit(exp)} className="text-white/20 hover:text-accent"><span className="material-symbols-outlined text-[18px]">edit_note</span></button>
                                            <button onClick={() => { if(confirm("Supprimer ?")) setExpenses(expenses.filter(e => e.id !== exp.id)) }} className="text-white/20 hover:text-red-500"><span className="material-symbols-outlined text-[18px]">delete</span></button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Floating Add Button */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-40">
                        <button onClick={() => { setEditingId(null); setFormData(initialFormState); setIsModalOpen(true); }} className="btn-plus w-20 h-20 rounded-full flex items-center justify-center text-dark active:scale-90">
                            <span className="material-symbols-outlined font-black text-5xl">add</span>
                        </button>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/85 backdrop-blur-sm p-4">
                            <div className="glass w-full max-w-sm p-8 modal-up mb-4 border-accent/20">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-extrabold tracking-tighter italic uppercase">{editingId ? 'Modifier' : 'Ajouter'}</h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-white/30"><span className="material-symbols-outlined">close</span></button>
                                </div>
                                <form onSubmit={handleSave} className="space-y-4">
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-white/30 uppercase tracking-widest ml-2">Date</label>
                                        <input type="date" className="w-full" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} required />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-white/30 uppercase tracking-widest ml-2">Montant & Détails</label>
                                        <input type="number" step="0.01" placeholder="0.00€" className="w-full text-2xl font-black" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} required />
                                        <input type="text" placeholder="Description" className="w-full text-sm font-bold mt-2" value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} required />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['propre', 'commun', 'pro'].map(c => (
                                            <button key={c} type="button" onClick={() => setFormData({...formData, cat: c})} className={`py-3 rounded-2xl text-[9px] font-black uppercase transition-all border ${formData.cat === c ? 'bg-white text-dark border-white scale-95' : 'bg-transparent text-white/40 border-white/10'}`}>
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-white/30 uppercase tracking-widest ml-2">Nature</label>
                                        <select className="w-full text-sm font-bold appearance-none" value={formData.nature} onChange={e => setFormData({...formData, nature: e.target.value})}>
                                            {NATURES.map(n => <option key={n.id} value={n.id} className="bg-dark text-white">{n.id}</option>)}
                                        </select>
                                    </div>
                                    <button className="btn-plus w-full py-5 rounded-3xl text-dark font-black tracking-widest text-xs mt-4 uppercase">{editingId ? 'Mettre à jour' : 'Enregistrer'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
